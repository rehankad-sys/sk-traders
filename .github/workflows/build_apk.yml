name: Build SK Traders Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Python & Flet Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SK_Traders_Android_App/requirements.txt

      - name: Compile Standalone Android APK (.apk)
        run: |
          cd SK_Traders_Android_App
          flet build apk --project "SK Traders Accounting" --description "SK Traders Mobile Khata" --org "com.sktraders.accounting"

      - name: Find and Rename APK
        run: |
          mkdir -p output_apk
          find SK_Traders_Android_App/build/apk -name "*.apk" -exec cp {} output_apk/SK_Traders_Accounting.apk \; || true
          ls -la output_apk/

      - name: Upload APK Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: SK_Traders_Accounting.apk
          path: output_apk/SK_Traders_Accounting.apk
          retention-days: 30
